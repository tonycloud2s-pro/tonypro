    <meta charset="UTF-8" />

    <title>คำนวณกำไรโปรโมชั่นร้านอาหาร (Grab / Lineman)</title>
    <meta name="description" content="เว็บแอปคำนวณกำไรโปรโมชั่นร้านอาหาร Grab และ Lineman สำหรับเจ้าของร้านอาหารไทย คำนวณ GP, VAT, ต้นทุน และราคาต่ำสุดที่ไม่ขาดทุน" />
    <meta property="og:title" content="คำนวณกำไรโปรโมชั่นร้านอาหาร (Grab / Lineman)" />
    <meta property="og:description" content="เว็บแอปคำนวณกำไรโปรโมชั่นร้านอาหาร Grab และ Lineman สำหรับเจ้าของร้านอาหารไทย คำนวณ GP, VAT, ต้นทุน และราคาต่ำสุดที่ไม่ขาดทุน" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // ตรวจสอบอัตโนมัติหากเปิดผ่าน GitHub Pages หรือเว็บเซิร์ฟเวอร์แบบสแตติกโดยไม่มี Vite
      (function() {
        var isViteDev = window.location.port === '3000' ||
                        window.location.hostname === 'localhost' ||
                        window.location.hostname === '127.0.0.1' ||
                        window.location.hostname.indexOf('run.app') !== -1;
        if (!isViteDev && !window.location.pathname.includes('/docs/')) {
          var cleanPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
          window.location.replace(cleanPath + '/docs/index.html' + window.location.search + window.location.hash);
        }
      })();
    </script>

  <body>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif; text-align: center; color: #991b1b; background-color: #fef2f2; border: 1px solid #fecaca; margin: 20px; border-radius: 12px;">
        <h2>กรุณาเปิดการใช้งาน JavaScript</h2>
        <p>เว็บแอปนี้ต้องการ JavaScript เพื่อประมวลผลการคำนวณและเก็บข้อมูลในเบราว์เซอร์ของคุณ</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
